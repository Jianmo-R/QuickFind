name: Feature request
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请描述使用场景，而不仅仅是实现方式。涉及 DeepSeek 网页自动化的建议，请说明官方网页当前的行为。
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 你现在遇到什么不便？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案
      description: 可以描述交互、结果展示或技术实现
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 Issue，确认不是重复建议
          required: true
