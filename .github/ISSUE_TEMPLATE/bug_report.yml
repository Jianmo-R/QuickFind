name: Bug report
description: 报告可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请勿粘贴 Token、Cookie、完整个人路径或敏感文件名。
        日志位于 `%LOCALAPPDATA%\QuickFind\error.log`，请先脱敏。
  - type: input
    id: version
    attributes:
      label: 版本
      description: Release 版本或提交 SHA
      placeholder: v1.0.0 / 200697c
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 受影响功能
      options:
        - 文件名匹配 / 索引
        - AI 相关 / DeepSeek 网页
        - 界面 / 热键 / 托盘
        - 构建 / 发布
        - 其他
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: Windows 11 24H2 (26100)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请写出最小、可重复的步骤
      placeholder: |
        1. 打开 QuickFind
        2. 输入 ...
        3. 点击 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 可附脱敏后的错误信息或截图
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 Issue，确认不是重复问题
          required: true
        - label: 我确认内容中不包含 Token、Cookie 或敏感文件路径
          required: true
