name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish single-file exe
        run: >
          dotnet publish .\QuickFind.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o .\dist

      - name: Add usage notes
        run: Copy-Item .\USAGE.zh-CN.txt .\dist\使用说明.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create $env:GITHUB_REF_NAME
          dist/QuickFind.exe "dist/使用说明.txt"
          --title "QuickFind $env:GITHUB_REF_NAME"
          --generate-notes
