name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - "USAGE.zh-CN.txt"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore .\QuickFind.csproj

      - name: Build
        run: dotnet build .\QuickFind.csproj -c Release --no-restore

      - name: Publish single-file exe
        run: >
          dotnet publish .\QuickFind.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o .\dist

      - name: Add usage notes
        run: Copy-Item .\USAGE.zh-CN.txt .\dist\使用说明.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickFind-win-x64
          path: |
            dist/QuickFind.exe
            dist/使用说明.txt
          if-no-files-found: error
          retention-days: 14
